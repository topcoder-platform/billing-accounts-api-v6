  'ajv@^6': 6.14.0
  axios: 1.18.1
  'brace-expansion@^1': 1.1.18
  'brace-expansion@^2': 2.1.4
  'brace-expansion@^5': 5.0.9
  deepmerge-ts: 8.0.0
  defu: 6.1.7
  'diff@^4': 4.0.4
  effect: 3.22.0
  'fast-uri@^3': 3.1.5
  flatted: 3.4.2
  follow-redirects: 1.16.0
  form-data: 4.0.6
  'js-yaml@^3': 3.15.1
  'js-yaml@^4': 4.3.1
  'js-yaml@^5': 5.2.2
  lodash: 4.18.1
  'minimatch@<3.1.4': 3.1.4
  'minimatch@>=9 <10': 9.0.9
  'minimatch@>=10 <11': 10.2.5
  multer: 2.2.0
  path-to-regexp: 8.4.2
